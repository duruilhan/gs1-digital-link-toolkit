name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ./gs1-digital-link-toolkit.slnx

      - name: Build
        run: dotnet build ./gs1-digital-link-toolkit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ./gs1-digital-link-toolkit.slnx --configuration Release --no-build
